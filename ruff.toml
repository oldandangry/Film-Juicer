target-version = "py313"
line-length = 120
# Public discovery supplies maintained files explicitly; fixtures and generated
# sources are never lint inputs. The private wrapper supplies its own finite list.
# `include` limits root-level discovery to the same maintained scope, so a bare
# `ruff format` never rewrites hash-checked Python under Resources/ or elsewhere.
include = ["scripts/**/*.py", "tests/**/*.py"]
extend-exclude = ["**/fixtures/**", "**/generated/**", "**/vendor/**", "**/vendored/**", "out", "external", "third_party", ".juicer-local"]

[lint]
select = ["E4", "E7", "E9", "F"]

[format]
line-ending = "lf"
