name: Supporting-code lint

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint-tooling:
    name: Python, shell and workflow lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: scripts/quality-requirements.txt
      - name: Install pinned lint tools
        run: python -m pip install -r scripts/quality-requirements.txt
      - name: Test the public runner
        run: python -m unittest discover -s tests/quality -p test_tooling_lint.py -v
      - name: Check supporting code
        run: python scripts/check-tooling.py
