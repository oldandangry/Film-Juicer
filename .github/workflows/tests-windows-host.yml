  windows-analysis:
    name: Windows Native, CUDA, and Rust Analysis
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      CUDA_PATH: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2
      CUDA_PATH_V13_2: C:\Program Files\NVIDIA GPU Computing Toolkit\CUDA\v13.2

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Enter VS 18 x64 analysis environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -version "[18.0,19.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsPath) { throw "Visual Studio 18 with the x64 C++ tools was not found" }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          $developerEnvironment = & $env:ComSpec /d /s /c `
            "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) { throw "VS 18 x64 developer environment setup failed" }
          foreach ($line in $developerEnvironment) {
            if ($line -match "^([^=][^=]*)=(.*)$") { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
          $llvmBin = Join-Path $vsPath "VC\Tools\Llvm\x64\bin"
          $clangFormat = Join-Path $llvmBin "clang-format.exe"
          $clangTidy = Join-Path $llvmBin "clang-tidy.exe"
          $rustLinker = Join-Path $llvmBin "lld-link.exe"
          foreach ($tool in @($clangFormat, $clangTidy, $rustLinker)) {
            if (!(Test-Path $tool -PathType Leaf)) { throw "Required VS 18 LLVM tool missing: $tool" }
          }
          $llvmBin >> $env:GITHUB_PATH
          "JUICER_CLANG_FORMAT=$clangFormat" >> $env:GITHUB_ENV
          "JUICER_CLANG_TIDY=$clangTidy" >> $env:GITHUB_ENV
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$rustLinker" >> $env:GITHUB_ENV

      - name: Install CUDA Toolkit 13.2
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $installer = Join-Path $env:RUNNER_TEMP "cuda_13.2.0_windows_network.exe"
          $uri = "https://developer.download.nvidia.com/compute/cuda/13.2.0/network_installers/cuda_13.2.0_windows_network.exe"
          Invoke-WebRequest -Uri $uri -OutFile $installer
          $actualHash = (Get-FileHash -Algorithm SHA256 $installer).Hash.ToLowerInvariant()
          if ($actualHash -ne "e30673c80fd9736b74370d6cc0efcccd42d74e8071cf43c785aeeeb96139975c") {
            throw "CUDA installer SHA-256 mismatch: $actualHash"
          }
          $components = @("-s", "crt_13.2", "cudart_13.2", "cufft_13.2", "cufft_dev_13.2",
            "curand_13.2", "curand_dev_13.2", "nvcc_13.2", "nvdisasm_13.2", "nvfatbin_13.2",
            "nvjitlink_13.2", "nvprune_13.2", "nvptxcompiler_13.2", "nvvm_13.2", "thrust_13.2")
          $install = Start-Process -FilePath $installer -ArgumentList $components -NoNewWindow -PassThru -Wait
          Remove-Item $installer -Force
          if ($install.ExitCode -ne 0) { throw "CUDA Toolkit 13.2 installation failed: $($install.ExitCode)" }
          $requiredFiles = @("$env:CUDA_PATH_V13_2\bin\nvcc.exe", "$env:CUDA_PATH_V13_2\include\cuda_runtime.h",
            "$env:CUDA_PATH_V13_2\include\curand_mtgp32_kernel.h", "$env:CUDA_PATH_V13_2\include\cccl\nv\target",
            "$env:CUDA_PATH_V13_2\lib\x64\cuda.lib", "$env:CUDA_PATH_V13_2\lib\x64\cudart.lib",
            "$env:CUDA_PATH_V13_2\lib\x64\cufft.lib")
          foreach ($path in $requiredFiles) { if (!(Test-Path $path)) { throw "CUDA component is missing: $path" } }
          "$env:CUDA_PATH_V13_2\bin" >> $env:GITHUB_PATH
          "$env:CUDA_PATH_V13_2\bin\x64" >> $env:GITHUB_PATH

      - name: Install pinned Rust quality tools and Python requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy --component rustfmt
          python -m pip install --upgrade pip
          python -m pip install cmake==4.3.1
          python -m pip install -r tests/requirements.txt
          rustc --version --verbose
          cargo --version
          rustfmt --version
          cargo clippy --version
          & $env:JUICER_CLANG_FORMAT --version
          & $env:JUICER_CLANG_TIDY --version
          cmake --version
          python --version
          & "$env:CUDA_PATH_V13_2\bin\nvcc.exe" --version

      - name: Configure Debug analysis inputs
        shell: pwsh
        run: cmake --preset windows-clang-debug -DBUILD_TESTING=ON

      - name: Build Debug analysis inputs
        shell: pwsh
        run: cmake --build --preset windows-clang-debug

      - name: Configure Release Rust inputs
        shell: pwsh
        run: cmake --preset windows-clang-release -DBUILD_TESTING=ON

      - name: Build Release Rust archive
        shell: pwsh
        run: cmake --build --preset windows-clang-release --target juicer_rust_build

      - name: Run cumulative Debug native, CUDA, and Rust quality
        shell: pwsh
        env:
          QUALITY_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          $ErrorActionPreference = "Stop"
          $qualityBase = $env:QUALITY_BASE
          $hasBase = $false
          if (![string]::IsNullOrWhiteSpace($qualityBase) -and $qualityBase -notmatch "^0+$") {
            git cat-file -e "$qualityBase^{commit}" 2>$null
            $hasBase = ($LASTEXITCODE -eq 0)
          }
          if ($hasBase) {
            python -u scripts/check-quality.py --base $qualityBase --preset windows-clang-debug --jobs 2
          } else {
            python -u scripts/check-quality.py --all-owned --preset windows-clang-debug --jobs 2
          }
          if ($LASTEXITCODE -ne 0) { throw "Debug quality gate failed" }

      - name: Run matching Release Rust quality
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          python -u scripts/check-quality.py --files Cargo.toml --preset windows-clang-release --jobs 2
          if ($LASTEXITCODE -ne 0) { throw "Release Rust quality gate failed" }

      - name: Select failed analysis control evidence
        if: always()
        id: failed-controls
        shell: pwsh
        run: python -B tests/ctest/control_artifacts.py --preset windows-clang-debug windows-clang-release --github-output "$env:GITHUB_OUTPUT"

      - name: Upload failed analysis controls and NPY samples
        if: always() && steps.failed-controls.outputs.paths != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-analysis-failed-controls
          path: ${{ steps.failed-controls.outputs.paths }}
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload analysis receipts and compile databases
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-analysis-quality
          path: |
            out/validation/windows-clang-debug/quality/**/*.log
            out/validation/windows-clang-debug/quality/**/*.json
            out/validation/windows-clang-debug/quality/parallel-controls/**
            out/build/windows-clang-debug/compile_commands.json
            out/validation/windows-clang-release/quality/**/*.log
            out/validation/windows-clang-release/quality/**/*.json
            out/build/windows-clang-release/compile_commands.json
          if-no-files-found: warn

  windows-tooling:
    name: Windows CTest Tooling
    runs-on: windows-2025-vs2026
    timeout-minutes: 90
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: tests/requirements.txt

      - name: Enter VS 18 x64 tooling environment
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -version "[18.0,19.0)" `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath
          if (!$vsPath) { throw "Visual Studio 18 with the x64 C++ tools was not found" }
          $devCmd = Join-Path $vsPath "Common7\Tools\VsDevCmd.bat"
          $developerEnvironment = & $env:ComSpec /d /s /c `
            "`"$devCmd`" -no_logo -arch=x64 -host_arch=x64 && set"
          if ($LASTEXITCODE -ne 0) { throw "VS 18 x64 developer environment setup failed" }
          foreach ($line in $developerEnvironment) {
            if ($line -match "^([^=][^=]*)=(.*)$") { "$($Matches[1])=$($Matches[2])" >> $env:GITHUB_ENV }
          }
          $llvmBin = Join-Path $vsPath "VC\Tools\Llvm\x64\bin"
          $llvmBin >> $env:GITHUB_PATH
          $rustLinker = Join-Path $llvmBin "lld-link.exe"
          if (!(Test-Path $rustLinker -PathType Leaf)) { throw "VS 18 lld-link was not found" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$rustLinker" >> $env:GITHUB_ENV

      - name: Install pinned Rust tools, CMake, and test requirements
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          rustup set profile minimal
          rustup toolchain install 1.98.1 --component clippy --component rustfmt
          python -m pip install --upgrade pip
          python -m pip install cmake==4.3.1
          python -m pip install -r tests/requirements.txt
          rustc --version --verbose
          cargo --version
          clang-cl --version
          cmake --version
          ctest --version
          python --version

      - name: Configure standalone tooling tests
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $python = (Get-Command python).Source
          $cargo = (Get-Command cargo).Source
          $ninja = (Get-Command ninja).Source
          cmake -S tests/tooling -B out/build/tooling-windows -G Ninja `
            -DCMAKE_BUILD_TYPE=Debug `
            -DCMAKE_C_COMPILER=clang-cl.exe `
            -DCMAKE_MAKE_PROGRAM="$ninja" `
            -DPython3_EXECUTABLE="$python" `
            -DJUICER_TOOLING_CARGO="$cargo" `
            -DJUICER_TOOLING_ROOT="$env:GITHUB_WORKSPACE" `
            -DJUICER_TOOLING_ARTIFACT_ROOT="$env:GITHUB_WORKSPACE\out\validation\windows-clang-debug"
          if ($LASTEXITCODE -ne 0) { throw "Standalone tooling configuration failed" }

      - name: List and run complete tooling selection
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ctest --test-dir out/build/tooling-windows -N -L tooling
          if ($LASTEXITCODE -ne 0) { throw "Tooling test discovery failed" }
          ctest --test-dir out/build/tooling-windows -L tooling --parallel 4 `
            --no-tests=error --output-on-failure `
            --output-junit "$env:GITHUB_WORKSPACE\out\validation\windows-clang-debug\tooling-junit.xml"
          if ($LASTEXITCODE -ne 0) { throw "Tooling tests failed" }

      - name: Select failed tooling controls
        if: always()
        id: failed-controls
        shell: pwsh
        run: python -B tests/ctest/control_artifacts.py --preset windows-clang-debug --github-output "$env:GITHUB_OUTPUT"

      - name: Upload failed tooling controls
        if: always() && steps.failed-controls.outputs.paths != ''
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-tooling-failed-controls
          path: ${{ steps.failed-controls.outputs.paths }}
          include-hidden-files: true
          if-no-files-found: warn

      - name: Upload tooling tests and Rust build evidence
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: windows-tooling-results
          path: |
            out/validation/windows-clang-debug/tooling-junit.xml
            out/validation/windows-clang-debug/ffi/rust-build/**
            out/build/tooling-windows/Testing/Temporary/LastTest.log
          if-no-files-found: warn

  windows-debug-host:
    name: Windows Debug host and Python checks
    if: always()
    needs:
      - windows-product-debug
      - windows-product-release
      - windows-analysis
      - windows-tooling
    runs-on: windows-2025-vs2026
    steps:
      - name: Set up Python 3.13
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Require every child result
        shell: python
        env:
          REQUIRED_RESULTS: ${{ toJSON(needs) }}
        run: |
          import json
          import os
          import sys

          expected = {
              "windows-product-debug",
              "windows-product-release",
              "windows-analysis",
              "windows-tooling",
          }
          try:
              results = json.loads(os.environ["REQUIRED_RESULTS"])
          except (KeyError, json.JSONDecodeError) as error:
              print(f"Cannot read required child results: {error}", file=sys.stderr)
              raise SystemExit(1)
          names = set(results)
          failures = {
              name: results.get(name, {}).get("result", "missing")
              for name in expected
              if results.get(name, {}).get("result") != "success"
          }
          unexpected = names - expected
          if failures or unexpected:
              print(f"Required child failures: {failures}; unexpected children: {sorted(unexpected)}", file=sys.stderr)
              raise SystemExit(1)
          print("All required Windows Debug, Release, analysis, and tooling children succeeded.")
