          if (!(Test-Path $rustLinker -PathType Leaf)) { throw "VS 18 lld-link was not found" }
          "CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_LINKER=$rustLinker" >> $env:GITHUB_ENV

      - name: Install CUDA Toolkit 13.2
